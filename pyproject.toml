[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenecon"
version = "0.2.1"
description = "Token-economics cost model and tiered model routing for agentic AI workloads"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Karmendra Pandey" }]
keywords = ["llm", "agents", "cost", "routing", "token-economics", "inference"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
tokenecon = "tokenecon.cli:main"

[project.urls]
Homepage = "https://github.com/karmendra8386/agentic-ai-token-economics"
Paper = "https://zenodo.org/records/23195511"
Repository = "https://github.com/karmendra8386/agentic-ai-token-economics"
DOI = "https://doi.org/10.5281/zenodo.23427025"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokenecon*"]
