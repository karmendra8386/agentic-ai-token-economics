name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest (Ubuntu 26.04) no longer ships a Python 3.9 build,
          # so the 3.9 leg runs on ubuntu-22.04 where it is still available.
          - python-version: "3.9"
            runs-on: ubuntu-22.04
          - python-version: "3.10"
            runs-on: ubuntu-latest
          - python-version: "3.11"
            runs-on: ubuntu-latest
          - python-version: "3.12"
            runs-on: ubuntu-latest
          - python-version: "3.13"
            runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -q
